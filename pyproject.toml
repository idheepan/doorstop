[project]

name = "doorstop"
version = "3.2"
description = "Requirements management using version control."

license = "LGPL-3.0-only"
license-files = ["LICENSE.md"]

authors = [{ name = "Jace Browning", email = "jacebrowning@gmail.com" }]

readme = "README.md"

keywords = [
  "requirements-management",
  "version-control",
  "documentation",
  "traceability",
  "markdown",
  "certification",
  "html",
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Editors :: Documentation",
    "Topic :: Text Processing :: Markup",
]

requires-python = ">=3.10,<3.15"

dependencies = [
    "pyyaml>=6.0,<7",
    "markdown>=3.3.3,<4",
    "bottle>=0.13.4,<0.14",
    "requests>=2.0,<3",
    "python-frontmatter>=1.0,<2",
    "python-markdown-math>=0.6,<0.10",
    "plantuml-markdown>=3.4.2,<4",
    "six", # fixes https://github.com/dougn/python-plantuml/issues/11
    "openpyxl>=3.1.2",
    "verchew>=3.4.2,<4",
]

[project.urls]

Homepage = "https://pypi.org/project/Doorstop"
Documentation = "https://doorstop.readthedocs.io"
Repository = "https://github.com/doorstop-dev/doorstop"

[project.scripts]

doorstop = "doorstop.cli.main:main"
doorstop-gui = "doorstop.gui.main:main"
doorstop-server = "doorstop.server.main:main"

[dependency-groups]

dev = [
    # Formatters
    "black>=24.3,<27.0",
    "isort>=5.12,<10.0",

    # Linters
    "mypy>=1.1.1",
    "pydocstyle",
    "pylint>=3.2,<4.2",
    "types-markdown",
    "types-pyyaml",
    "types-requests",
    "types-setuptools",

    # Testing
    "pytest>=8.4,<10.0",
    "pytest-cov",
    "pytest-expecter",
    "pytest-sugar",
    "webtest>=3.0.7,<4",
    "diff-cover>=8.0.3,<11.0.0",

    # Reports
    "coveragespace>=6.1,<7",

    # Documentation
    "mkdocs>=1.5,<2",
    "pygments",

    # Tooling
    "pyinstaller>=6.21,<7",
    "sniffer",
    "pync; sys_platform == 'darwin'",
    "rope",
]

[tool.black]

quiet = true

[tool.isort]

profile = "black"

[build-system]

requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]

module-root = ""
source-exclude = ["**/tests/**"]
wheel-exclude = ["**/tests/**"]
