version: 2

build:
  os: "ubuntu-22.04"
  tools:
    python: "3.15"
  jobs:
    post_create_environment:
      # Install uv
      # https://docs.readthedocs.com/platform/stable/build-customization.html#install-dependencies-with-uv
      - pip install uv
    post_install:
      # Install project and dev dependencies into the Read the Docs virtualenv
      - UV_PROJECT_ENVIRONMENT=$READTHEDOCS_VIRTUALENV_PATH uv sync --locked

mkdocs:
  configuration: mkdocs.yml
